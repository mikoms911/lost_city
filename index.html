<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#181614">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Lost Cities</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
  <nav id="tabs" role="tablist">
    <span class="brand">Lost Cities</span>
    <button type="button" role="tab" data-tab="play" aria-selected="true">게임</button>
    <button type="button" role="tab" data-tab="history" aria-selected="false">대전 기록</button>
  </nav>

  <main id="view-play">
    <section id="lobby">
      <h1>Lost Cities</h1>
      <p class="sub" id="lobby-sub">2인용 온라인 원정 카드게임 · 3라운드 합산</p>
      <form id="join-form" novalidate>
        <label>이름 <input id="name" maxlength="12" required autocomplete="off"></label>

        <fieldset class="mode" id="friend-mode">
          <legend>친구와 대전</legend>
          <label>방 코드 <input id="room" maxlength="12" autocomplete="off" placeholder="친구와 같은 코드"></label>
          <button type="submit">입장</button>
        </fieldset>

        <fieldset class="mode">
          <legend>혼자 하기</legend>
          <div class="levels" role="radiogroup" aria-label="난이도">
            <label><input type="radio" name="level" value="easy"> 쉬움</label>
            <label><input type="radio" name="level" value="normal" checked> 보통</label>
          </div>
          <button type="button" id="solo-btn">컴퓨터와 대전</button>
        </fieldset>
      </form>
      <p class="note" id="lobby-note">대전 기록은 이름으로 구분됩니다. 매번 같은 이름을 쓰세요.</p>
      <p id="lobby-error" class="error" role="alert"></p>
    </section>

    <section id="game" hidden>
      <header id="topbar">
        <div>
          <div id="round-label"></div>
          <div id="status"></div>
        </div>
        <div id="scores"></div>
      </header>

      <div id="board"></div>

      <div id="side">
        <button id="deck" type="button"></button>
        <div id="opp-info"></div>
        <button id="show-result" type="button" hidden>결과 보기</button>
      </div>
      <div id="leave-wrap"><button id="leave" type="button" class="link">나가기</button></div>

      <div id="hand-wrap">
        <div id="hand"></div>
        <div id="hint"></div>
      </div>

      <div id="result" hidden>
        <div class="box">
          <h2 id="result-title"></h2>
          <p id="result-sub"></p>
          <table id="round-table" class="tbl"></table>
          <h3>라운드별 점수</h3>
          <table id="match-table" class="tbl"></table>
          <div class="actions">
            <button id="hide-result" type="button" class="ghost">보드 보기</button>
            <button id="next" type="button"></button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <main id="view-history" hidden>
    <div class="history-head">
      <h2>대전 기록</h2>
      <button id="refresh-history" type="button" class="ghost">새로고침</button>
    </div>
    <p id="history-empty" class="muted" hidden>아직 끝난 경기가 없습니다. 3라운드를 모두 마치면 기록됩니다.</p>
    <section id="stats-section">
      <h3>플레이어 통계</h3>
      <div class="scroll"><table id="stats-table" class="tbl"></table></div>
    </section>
    <section id="matches-section">
      <h3>최근 경기</h3>
      <div id="match-list"></div>
    </section>
  </main>

  <div id="toast" role="status"></div>
  <script src="engine.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  </script>
</body>
</html>
